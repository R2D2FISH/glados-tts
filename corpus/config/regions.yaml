  new_york_city:          # Houston St, Queens hyphenated addresses
    pbf: new-york-latest.osm.pbf
    bbox: [-74.1, 40.55, -73.7, 40.9]
    routes: 600
  massachusetts:          # Worcester, Natick, Gloucester, rotaries
    pbf: massachusetts-latest.osm.pbf
    routes: 500
  maine:
    pbf: maine-latest.osm.pbf
    routes: 200
  washington_dc:
    pbf: district-of-columbia-latest.osm.pbf
    routes: 200
  alaska_anchorage:
